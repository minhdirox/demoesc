    <script>
            (function () {
                function openVideoPopup(videoId) {
                    const playerHtml = `
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>ESC's Training Content</title>
                        <style>
                            /* Make the body take up the full viewport */
                            body, html { 
                                margin: 0; padding: 0; 
                                background: #000; 
                                width: 100%; height: 100%; 
                                overflow: hidden; 
                                display: flex; justify-content: center; align-items: center;
                            }
                            /* Force iframe to fill the screen */
                            iframe { 
                                width: 100vw; 
                                height: 100vh; 
                                border: none;
                                background: #000;
                            }
                        </style>
                    </head>
                    <body>
                        <iframe 
                            src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </body>
                    </html>
                `;
                    const newWindow = window.open('', '_blank');
                    if (newWindow) {
                        newWindow.document.open();
                        newWindow.document.write(playerHtml);
                        newWindow.document.close();
                    } else {
                        alert('Please enable pop-ups to view this video.');
                    }
                }

                document.addEventListener('DOMContentLoaded', function () {
                    document.body.addEventListener('click', function (e) {
                        const link = e.target.closest('a');
                        if (link && link.id === 'jPAFmB4mhwQ') {
                            e.preventDefault();
                            openVideoPopup(link.id);
                        }
                    });
                });
            })();
    </script>
